name: Comfy Runtime Image

on:
  push:
    branches:
      - stage-two-five-comfy-runtime
    paths:
      - ".github/workflows/comfy-runtime-image.yml"
      - "comfy-runtime/**"
      - "scripts/comfy-runtime-contract-tests.ts"
      - "scripts/comfy-node-profile-tests.ts"
      - "scripts/workflow-asset-tests.ts"
      - "src/lib/generation/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Immutable ComfyUI runtime tag"
        required: false
        default: ""
      verify_existing_digest:
        description: "Existing sha256 digest to verify without rebuilding"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - ci/comfy-runtime-smoke-base

permissions:
  contents: read

concurrency:
  group: comfy-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disk-safe-ab-diagnose:
    name: Disk-safe A/B diagnose fixed digest
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && github.event_name == 'push' && contains(github.event.head_commit.message, '[ab-diagnose]') && contains(github.event.head_commit.message, '[skip build]') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMFY_RUNTIME_IMAGE_NAME: ghcr.io/gouzhuoqunn/ai-creative-comfy-runtime
      COMFY_RUNTIME_DIGEST: sha256:1cfb4740fb8b310a8095500e8fe55160176c619306068d553092182f4888efd1
      COMFY_RUNTIME_IMAGE: ghcr.io/gouzhuoqunn/ai-creative-comfy-runtime@sha256:1cfb4740fb8b310a8095500e8fe55160176c619306068d553092182f4888efd1
    steps:
      - name: Confirm zero-build diagnostic mode
        shell: bash
        run: |
          set -euo pipefail
          echo "build=skipped"
          echo "push=skipped"
          echo "permissions=contents:read"
          echo "repository_secrets_used=false"
          echo "classification_previous_run=ci_runner_disk_exhausted_before_ab"

      - name: Disk preflight before pull
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '\"')"
          echo "runner_kernel=$(uname -a)"
          echo "===== df -h"
          df -h
          echo "===== df -B1 /"
          df -B1 /
          echo "initial_free_bytes=$(df -B1 / | awk 'NR==2 {print $4}')" | tee -a "$GITHUB_ENV"
          echo "===== docker info storage driver"
          docker info --format 'storage_driver={{.Driver}}'
          echo "===== docker system df -v"
          docker system df -v || true
          echo "===== selected directory sizes"
          sudo du -sh /var/lib/docker /opt /usr/local /usr/share "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}" 2>/dev/null || true
          echo "===== largest selected directories max-depth=2"
          sudo du -x -B1 --max-depth=2 /var/lib/docker /opt /usr/local /usr/share 2>/dev/null | sort -nr | head -30 || true

      - name: Compute anonymous manifest layer sizes
        id: manifest_size
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config-manifest"
          mkdir -p "${DOCKER_CONFIG}"
          printf '{}\n' > "${DOCKER_CONFIG}/config.json"
          set +e
          docker buildx imagetools inspect --raw "${COMFY_RUNTIME_IMAGE}" >/tmp/index.json
          raw_status=$?
          set -e
          if [ "${raw_status}" -ne 0 ]; then
            fallback_reason="index_inspect_failed"
            compressed_layer_bytes=0
            required_free_bytes=$((45 * 1024 * 1024 * 1024))
            amd64_manifest_digest=""
          else
            python3 - <<'PY' >/tmp/manifest-env
          import json
          import os
          import subprocess
          import sys

          image_name = os.environ["COMFY_RUNTIME_IMAGE_NAME"]
          expected_digest = os.environ["COMFY_RUNTIME_DIGEST"]
          index = json.load(open("/tmp/index.json", "r", encoding="utf-8"))
          manifests = index.get("manifests", [])
          selected = None
          for manifest in manifests:
              platform = manifest.get("platform", {})
              if platform.get("os") == "linux" and platform.get("architecture") == "amd64":
                  selected = manifest
                  break
          if selected is None:
              print("fallback_reason=linux_amd64_manifest_not_found")
              print("compressed_layer_bytes=0")
              print("required_free_bytes=" + str(45 * 1024 * 1024 * 1024))
              print("amd64_manifest_digest=")
              sys.exit(0)

          amd64_digest = selected["digest"]
          raw = subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", "--raw", f"{image_name}@{amd64_digest}"],
              text=True,
          )
          manifest = json.loads(raw)
          layers = manifest.get("layers", [])
          compressed = sum(int(layer.get("size", 0)) for layer in layers)
          config_size = int(manifest.get("config", {}).get("size", 0))
          max_layer = max((int(layer.get("size", 0)) for layer in layers), default=0)
          required = max(35 * 1024 * 1024 * 1024, compressed * 3 + 8 * 1024 * 1024 * 1024)
          exact_match = str(index.get("mediaType", "")).endswith("image.index.v1+json") and expected_digest.startswith("sha256:")
          print("fallback_reason=")
          print(f"layer_count={len(layers)}")
          print(f"compressed_layer_bytes={compressed}")
          print(f"config_size_bytes={config_size}")
          print(f"max_layer_bytes={max_layer}")
          print(f"required_free_bytes={required}")
          print(f"amd64_manifest_digest={amd64_digest}")
          print(f"input_digest_exact={str(exact_match).lower()}")
          PY
            set -a
            # shellcheck disable=SC1091
            . /tmp/manifest-env
            set +a
          fi
          cat /tmp/manifest-env 2>/dev/null || {
            echo "fallback_reason=${fallback_reason}"
            echo "compressed_layer_bytes=${compressed_layer_bytes}"
            echo "required_free_bytes=${required_free_bytes}"
            echo "amd64_manifest_digest=${amd64_manifest_digest}"
          }
          {
            echo "compressed_layer_bytes=${compressed_layer_bytes}"
            echo "required_free_bytes=${required_free_bytes}"
            echo "amd64_manifest_digest=${amd64_manifest_digest}"
            echo "manifest_fallback_reason=${fallback_reason}"
          } >> "$GITHUB_ENV"
          {
            echo "compressed_layer_bytes=${compressed_layer_bytes}"
            echo "required_free_bytes=${required_free_bytes}"
          } >> "$GITHUB_OUTPUT"

      - name: Allowlisted runner disk cleanup
        shell: bash
        run: |
          set -euo pipefail
          before_free="$(df -B1 / | awk 'NR==2 {print $4}')"
          echo "cleanup_before_free_bytes=${before_free}"

          docker system prune -af --volumes || true
          docker builder prune -af || true
          docker buildx prune -af || true
          sudo apt-get clean

          echo "===== allowlisted directory sizes before deletion"
          for path in /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/share/dotnet /opt/hostedtoolcache/CodeQL /opt/google/chrome /opt/microsoft/msedge; do
            if [ -d "${path}" ]; then
              sudo du -sh "${path}"
            else
              echo "missing ${path}"
            fi
          done

          if [ -d /usr/local/lib/android ]; then sudo rm -rf /usr/local/lib/android; fi
          if [ -d /opt/ghc ]; then sudo rm -rf /opt/ghc; fi
          if [ -d /usr/local/.ghcup ]; then sudo rm -rf /usr/local/.ghcup; fi
          if [ -d /usr/share/swift ]; then sudo rm -rf /usr/share/swift; fi
          if [ -d /usr/share/dotnet ]; then sudo rm -rf /usr/share/dotnet; fi
          if [ -d /opt/hostedtoolcache/CodeQL ]; then sudo rm -rf /opt/hostedtoolcache/CodeQL; fi
          if [ -d /opt/google/chrome ]; then sudo rm -rf /opt/google/chrome; fi
          if [ -d /opt/microsoft/msedge ]; then sudo rm -rf /opt/microsoft/msedge; fi

          after_free="$(df -B1 / | awk 'NR==2 {print $4}')"
          reclaimed="$(( after_free - before_free ))"
          echo "cleanup_after_free_bytes=${after_free}"
          echo "cleanup_reclaimed_bytes=${reclaimed}" | tee -a "$GITHUB_ENV"
          echo "===== df after cleanup"
          df -h
          df -B1 /
          echo "===== docker system df after cleanup"
          docker system df -v || true
          echo "===== largest selected directories after cleanup"
          sudo du -x -B1 --max-depth=2 /var/lib/docker /opt /usr/local /usr/share 2>/dev/null | sort -nr | head -30 || true

      - name: Disk gate before fixed digest pull
        shell: bash
        run: |
          set -euo pipefail
          actual_free="$(df -B1 / | awk 'NR==2 {print $4}')"
          echo "compressed_layer_bytes=${compressed_layer_bytes}"
          echo "required_free_bytes=${required_free_bytes}"
          echo "actual_free_bytes=${actual_free}"
          echo "cleanup_reclaimed_bytes=${cleanup_reclaimed_bytes}"
          if [ "${actual_free}" -lt "${required_free_bytes}" ]; then
            echo "classification=insufficient_runner_disk_after_allowlisted_cleanup"
            echo "===== largest selected directories"
            sudo du -x -B1 --max-depth=2 /var/lib/docker /opt /usr/local /usr/share 2>/dev/null | sort -nr | head -30 || true
            exit 1
          fi
          echo "disk_gate=passed"

      - name: Pull fixed digest once anonymously
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config-pull"
          mkdir -p "${DOCKER_CONFIG}"
          printf '{}\n' > "${DOCKER_CONFIG}/config.json"
          python3 - <<'PY'
          import json
          import os
          config = json.load(open(os.environ["DOCKER_CONFIG"] + "/config.json", "r", encoding="utf-8"))
          if config.get("auths"):
              raise SystemExit("docker auths unexpectedly present")
          PY
          before_pull_free="$(df -B1 / | awk 'NR==2 {print $4}')"
          echo "before_pull_free_bytes=${before_pull_free}"
          docker pull --platform linux/amd64 "${COMFY_RUNTIME_IMAGE}"
          after_pull_free="$(df -B1 / | awk 'NR==2 {print $4}')"
          echo "after_pull_free_bytes=${after_pull_free}" | tee -a "$GITHUB_ENV"
          docker image inspect "${COMFY_RUNTIME_IMAGE}" >/tmp/image-inspect.json
          python3 - <<'PY'
          import json
          import os
          data = json.load(open("/tmp/image-inspect.json", "r", encoding="utf-8"))[0]
          expected = os.environ["COMFY_RUNTIME_IMAGE"]
          repo_digests = data.get("RepoDigests", [])
          print("repo_digests=" + ",".join(repo_digests))
          if expected not in repo_digests:
              raise SystemExit("RepoDigest did not exactly match fixed digest")
          PY

      - name: Verify dependency and import order evidence
        shell: bash
        run: |
          set -euo pipefail
          container="comfy-runtime-ab-evidence-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" --entrypoint /bin/bash "${COMFY_RUNTIME_IMAGE}" -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker exec "${container}" sh -lc 'grep -Fx "comfy-kitchen==0.2.18" /opt/ComfyUI/requirements.txt'
          docker exec "${container}" python3.11 - <<'PY'
          import importlib.metadata as metadata
          import pathlib
          import re
          import sys

          import torch

          print("python=" + sys.version.split()[0])
          print("comfy-kitchen=" + metadata.version("comfy-kitchen"))
          print("triton=" + metadata.version("triton"))
          print("torch=" + torch.__version__)
          print("torch_cuda=" + str(torch.version.cuda))

          init = pathlib.Path("/usr/local/lib/python3.11/dist-packages/comfy_kitchen/__init__.py").read_text(encoding="utf-8")
          triton_init = pathlib.Path("/usr/local/lib/python3.11/dist-packages/comfy_kitchen/backends/triton/__init__.py").read_text(encoding="utf-8")
          quantization = pathlib.Path("/usr/local/lib/python3.11/dist-packages/comfy_kitchen/backends/triton/quantization.py").read_text(encoding="utf-8")
          main = pathlib.Path("/opt/ComfyUI/main.py").read_text(encoding="utf-8")
          quant_ops = pathlib.Path("/opt/ComfyUI/comfy/quant_ops.py").read_text(encoding="utf-8")

          assert "from .backends import triton as _triton_backend" in init
          assert re.search(r"except\s+ImportError", triton_init)
          assert "@triton.autotune" in quantization
          assert "import comfy_kitchen as ck" in quant_ops
          assert main.find("import comfy.utils") < main.find("args.disable_triton_backend")
          print("classification=comfy_kitchen_eager_triton_import_on_cpu")
          print("comfy_kitchen_init_imports_triton_backend=true")
          print("triton_backend_catches_import_error_only=true")
          print("disable_triton_backend_after_comfy_kitchen_import=true")
          PY

      - name: Test A original CPU behavior
        shell: bash
        run: |
          set -euo pipefail
          container="comfy-runtime-ab-a-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" --entrypoint /bin/bash "${COMFY_RUNTIME_IMAGE}" -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          started_at="$(date +%s)"
          set +e
          docker exec "${container}" sh -lc 'cd /opt/ComfyUI && timeout 60s python3.11 main.py --cpu --disable-triton-backend --disable-all-custom-nodes --listen 127.0.0.1 --port 8188 --input-directory /workspace/comfy-input --output-directory /workspace/comfy-output --user-directory /workspace/comfy-user --models-directory /workspace/models --disable-auto-launch --preview-method none --log-stdout --verbose DEBUG >/tmp/test-a.log 2>&1'
          code=$?
          set -e
          seconds="$(( $(date +%s) - started_at ))"
          tail -n 200 < <(docker exec "${container}" tail -n 200 /tmp/test-a.log)
          test "${code}" -ne 0
          docker exec "${container}" grep -F "comfy_kitchen" /tmp/test-a.log
          docker exec "${container}" grep -F "backends/triton" /tmp/test-a.log
          docker exec "${container}" grep -F "RuntimeError" /tmp/test-a.log
          docker exec "${container}" grep -F "0 active drivers" /tmp/test-a.log
          echo "test_a_exit_code=${code}"
          echo "test_a_start_seconds=${seconds}"
          echo "test_a_crash_phase=comfy_kitchen_eager_triton_import"
          echo "test_a_health_before_exit=false"

      - name: Test B temporary Triton import blocker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-import-blocker/triton
          cat > smoke-import-blocker/triton/__init__.py <<'PY'
          raise ImportError(
              "Triton intentionally unavailable in COMFY_RUNTIME_MODE=smoke_cpu"
          )
          PY

          container="comfy-runtime-ab-b-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            --entrypoint /bin/bash \
            -v "${PWD}/smoke-import-blocker:/run/smoke-import-blocker:ro" \
            "${COMFY_RUNTIME_IMAGE}" \
            -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker exec -e PYTHONPATH=/run/smoke-import-blocker "${container}" python3.11 - <<'PY'
          try:
              import triton  # noqa: F401
          except ImportError as exc:
              print(str(exc))
          else:
              raise SystemExit("temporary triton blocker was not first on sys.path")

          import comfy_kitchen as ck
          print("comfy_kitchen_import=ok")
          print("comfy_kitchen_eager_backend_available=true")
          print("comfy_kitchen_triton_marked_unavailable=true")
          PY

          started_at="$(date +%s)"
          docker exec -e PYTHONPATH=/run/smoke-import-blocker "${container}" sh -lc 'cd /opt/ComfyUI && python3.11 main.py --cpu --disable-triton-backend --disable-all-custom-nodes --listen 127.0.0.1 --port 8188 --input-directory /workspace/comfy-input --output-directory /workspace/comfy-output --user-directory /workspace/comfy-user --models-directory /workspace/models --disable-auto-launch --preview-method none --log-stdout --verbose DEBUG >/tmp/test-b.log 2>&1 & echo $! >/tmp/test-b.pid'
          ready=false
          for attempt in $(seq 1 60); do
            if ! docker exec "${container}" sh -lc 'kill -0 "$(cat /tmp/test-b.pid)" 2>/dev/null'; then
              echo "::error::Test B ComfyUI exited"
              docker exec "${container}" tail -n 200 /tmp/test-b.log || true
              exit 1
            fi
            if docker exec "${container}" curl -fsS http://127.0.0.1:8188/system_stats >/tmp/system-stats.json; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "${ready}" != "true" ]; then
            echo "::error::Test B did not become healthy"
            docker exec "${container}" tail -n 200 /tmp/test-b.log || true
            exit 1
          fi
          seconds="$(( $(date +%s) - started_at ))"
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/object_info >/tmp/object-info.json
          docker exec "${container}" sh -lc '! grep -F "0 active drivers" /tmp/test-b.log'
          docker exec "${container}" sh -lc '! find /workspace/models -type f | grep .'
          docker exec "${container}" sh -lc '! find /workspace/comfy-output -type f | grep .'
          docker exec "${container}" sh -lc 'kill -TERM "$(cat /tmp/test-b.pid)"'
          for attempt in $(seq 1 10); do
            if ! docker exec "${container}" sh -lc 'kill -0 "$(cat /tmp/test-b.pid)" 2>/dev/null'; then
              break
            fi
            sleep 3
          done
          docker exec "${container}" sh -lc '! kill -0 "$(cat /tmp/test-b.pid)" 2>/dev/null'
          docker exec "${container}" sh -lc '! pgrep -af "python3.11 main.py"'
          echo "test_b_start_seconds=${seconds}"
          echo "test_b_system_stats=passed"
          echo "test_b_object_info=passed"
          echo "test_b_no_inference=passed"
          echo "test_b_sigterm=passed"
          echo "classification=comfy_kitchen_triton_import_blocker_ab_proven"

  diagnose-node-profile-fixed-digest:
    name: Diagnose Kornia gate and production node profile
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && github.event_name == 'push' && contains(github.event.head_commit.message, '[node-profile]') && contains(github.event.head_commit.message, '[skip build]') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      gate_passed: ${{ steps.d4.outputs.gate_passed }}
      kornia_version: ${{ steps.versions.outputs.kornia_version }}
    env:
      COMFY_RUNTIME_IMAGE_NAME: ghcr.io/gouzhuoqunn/ai-creative-comfy-runtime
      COMFY_RUNTIME_DIGEST: sha256:1cfb4740fb8b310a8095500e8fe55160176c619306068d553092182f4888efd1
      COMFY_RUNTIME_IMAGE: ghcr.io/gouzhuoqunn/ai-creative-comfy-runtime@sha256:1cfb4740fb8b310a8095500e8fe55160176c619306068d553092182f4888efd1
    steps:
      - uses: actions/checkout@v4

      - name: Confirm diagnose gate mode
        shell: bash
        run: |
          set -euo pipefail
          echo "build=skipped_until_diagnosis_gate"
          echo "push=skipped_until_diagnosis_gate"
          echo "permissions=contents:read"
          echo "repository_secrets_used=false"
          echo "diagnosis_target=${COMFY_RUNTIME_IMAGE}"

      - name: Disk cleanup and anonymous pull fixed digest
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config-node-profile"
          mkdir -p "${DOCKER_CONFIG}"
          printf '{}\n' > "${DOCKER_CONFIG}/config.json"
          docker system prune -af --volumes || true
          docker builder prune -af || true
          sudo apt-get clean
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h
          docker buildx imagetools inspect "${COMFY_RUNTIME_IMAGE}" >/tmp/node-profile-inspect.txt
          grep -F "linux/amd64" /tmp/node-profile-inspect.txt
          docker pull --platform linux/amd64 "${COMFY_RUNTIME_IMAGE}"
          docker image inspect "${COMFY_RUNTIME_IMAGE}" >/tmp/node-profile-image-inspect.json
          python3 - <<'PY'
          import json
          import os

          data = json.load(open("/tmp/node-profile-image-inspect.json", "r", encoding="utf-8"))[0]
          expected = os.environ["COMFY_RUNTIME_IMAGE"]
          repo_digests = data.get("RepoDigests", [])
          print("repo_digests=" + ",".join(repo_digests))
          if expected not in repo_digests:
              raise SystemExit("fixed digest did not match RepoDigests exactly")
          PY

      - name: Record dependency versions and Comfy source facts
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          container="comfy-runtime-facts-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" --entrypoint /bin/bash "${COMFY_RUNTIME_IMAGE}" -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker exec -i "${container}" python3.11 - <<'PY' >/tmp/runtime-facts.txt
          import importlib.metadata as metadata
          import pathlib
          import platform
          import re
          import sys
          import sysconfig

          allow = [
              "torch",
              "torchvision",
              "torchaudio",
              "triton",
              "comfy-kitchen",
              "kornia",
              "numpy",
              "scipy",
          ]

          print("python_version=" + platform.python_version())
          print("python_abi=" + sysconfig.get_config_var("SOABI"))
          print("glibc=" + ",".join(platform.libc_ver()))
          print("machine=" + platform.machine())
          cpuinfo = pathlib.Path("/proc/cpuinfo").read_text(encoding="utf-8", errors="replace")
          flags = ""
          for line in cpuinfo.splitlines():
              if line.startswith("flags"):
                  flags = line.split(":", 1)[1].strip()
                  break
          print("cpu_flags=" + flags)

          for name in allow:
              try:
                  dist = metadata.distribution(name)
              except metadata.PackageNotFoundError:
                  print(f"{name}=not_installed")
                  continue
              print(f"{name}={dist.version}")
              print(f"{name}_site_packages={dist.locate_file('')}")
              installer = dist.read_text("INSTALLER") or ""
              print(f"{name}_installer={installer.strip() or 'unknown'}")
              wheel = dist.read_text("WHEEL") or ""
              wheel_tag = next((line.split(":", 1)[1].strip() for line in wheel.splitlines() if line.startswith("Tag:")), "unknown")
              print(f"{name}_wheel_tag={wheel_tag}")

          requirements = pathlib.Path("/opt/ComfyUI/requirements.txt").read_text(encoding="utf-8")
          for line in requirements.splitlines():
              if "kornia" in line.lower():
                  print("comfyui_requirements_kornia_line=" + line.strip())

          nodes = pathlib.Path("/opt/ComfyUI/nodes.py").read_text(encoding="utf-8")
          main = pathlib.Path("/opt/ComfyUI/main.py").read_text(encoding="utf-8")
          post = pathlib.Path("/opt/ComfyUI/comfy_extras/nodes_post_processing.py").read_text(encoding="utf-8")
          assert "def init_builtin_extra_nodes" in nodes
          assert "nodes_post_processing.py" in nodes
          assert re.search(r"import\s+kornia|from\s+kornia", post)
          assert "disable_all_custom_nodes" in main
          assert "init_extra_nodes" in main
          print("builtin_extra_nodes_not_controlled_by_disable_all_custom_nodes=true")
          print("nodes_post_processing_imports_kornia=true")
          print("init_extra_nodes_before_health_server=true")

          search_roots = [
              pathlib.Path("/opt/ComfyUI/comfy_extras"),
              pathlib.Path("/opt/ComfyUI/nodes.py"),
              pathlib.Path("/opt/ComfyUI/comfy_api_nodes"),
          ]
          workflow_used_files = {
              "comfy_extras/nodes_flux.py",
              "comfy_extras/nodes_images.py",
              "comfy_extras/nodes_model_advanced.py",
              "comfy_extras/nodes_video.py",
              "comfy_extras/nodes_wan.py",
          }
          patterns = [
              "import kornia",
              "from kornia",
              "torch.jit.script",
              "@torch.jit.script",
          ]
          print("kornia_import_sources_begin")
          for root in search_roots:
              files = [root] if root.is_file() else sorted(root.rglob("*.py"))
              for path in files:
                  text = path.read_text(encoding="utf-8", errors="replace")
                  rel = str(path.relative_to("/opt/ComfyUI"))
                  used = str(rel in workflow_used_files).lower()
                  for lineno, line in enumerate(text.splitlines(), start=1):
                      if any(pattern in line for pattern in patterns):
                          print(f"{rel}:{lineno}:workflow_used={used}:{line.strip()}")
          print("kornia_import_sources_end")
          PY
          cat /tmp/runtime-facts.txt
          kornia_version="$(awk -F= '$1=="kornia" {print $2; exit}' /tmp/runtime-facts.txt)"
          if [ -z "${kornia_version}" ] || [ "${kornia_version}" = "not_installed" ]; then
            echo "::error::Unable to record exact Kornia version from fixed digest"
            exit 1
          fi
          echo "kornia_version=${kornia_version}" >> "$GITHUB_OUTPUT"

      - name: Reuse prior D1 and D2 Kornia evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "previous_run=29343137485"
          echo "d1=import torch; import kornia segfaulted under Triton blocker"
          echo "d1_exit_code=139"
          echo "d2=torch.jit.script identity monkeypatch allowed Kornia import"
          echo "classification=kornia_import_segmentation_avoided_by_jit_identity"

      - name: D3 Locate builtin extra crash source in original order
        shell: bash
        run: |
          set -euo pipefail
          container="comfy-runtime-d3-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            --entrypoint /bin/bash \
            -v "${PWD}/comfy-runtime:/run/comfy-runtime:ro" \
            "${COMFY_RUNTIME_IMAGE}" \
            -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          cat >/tmp/d3_builtin_order.py <<'PY'
          import ast
          import hashlib
          import os
          import pathlib
          import sys

          sys.path.insert(0, "/opt/ComfyUI")
          os.chdir("/opt/ComfyUI")

          sys.argv = [
              "main.py",
              "--cpu",
              "--disable-triton-backend",
              "--disable-all-custom-nodes",
              "--disable-auto-launch",
              "--preview-method",
              "none",
              "--log-stdout",
              "--verbose",
              "DEBUG",
              "--listen",
              "127.0.0.1",
              "--port",
              "8188",
              "--input-directory",
              "/workspace/comfy-input",
              "--output-directory",
              "/workspace/comfy-output",
              "--user-directory",
              "/workspace/comfy-user",
              "--models-directory",
              "/workspace/models",
          ]

          import comfy.options

          comfy.options.enable_args_parsing()
          from comfy.cli_args import args

          assert args.cpu is True, args
          assert args.listen == "127.0.0.1", args.listen
          assert int(args.port) == 8188, args.port
          print("D3_ARGS_READY cpu=True listen=127.0.0.1 port=8188", flush=True)

          import nodes
          import comfy.model_management as model_management

          assert model_management.cpu_state == model_management.CPUState.CPU, model_management.cpu_state
          assert model_management.get_torch_device().type == "cpu", model_management.get_torch_device()
          print("D3_CPU_STATE_OK torch_device=cpu", flush=True)

          nodes_path = pathlib.Path("/opt/ComfyUI/nodes.py")
          nodes_text = nodes_path.read_text(encoding="utf-8")
          nodes_sha = hashlib.sha256(nodes_text.encode("utf-8")).hexdigest()
          print("comfyui_nodes_sha256=" + nodes_sha, flush=True)

          tree = ast.parse(nodes_text)
          extras_files = None
          for function in [item for item in tree.body if isinstance(item, ast.FunctionDef)]:
              if function.name != "init_builtin_extra_nodes":
                  continue
              for statement in ast.walk(function):
                  if isinstance(statement, ast.Assign):
                      for target in statement.targets:
                          if isinstance(target, ast.Name) and target.id == "extras_files":
                              extras_files = ast.literal_eval(statement.value)
          if not extras_files:
              raise RuntimeError("Unable to extract extras_files from nodes.py")
          print("D3_EXTRAS_FILE_COUNT=" + str(len(extras_files)), flush=True)

          loaded = []
          for relative_file in extras_files:
              extra_path = pathlib.Path("/opt/ComfyUI") / relative_file
              print("LOADING_BUILTIN_EXTRA=" + relative_file, flush=True)
              nodes.load_custom_node(str(extra_path), module_parent="comfy_extras")
              loaded.append(relative_file)
              print("LOADED_BUILTIN_EXTRA=" + relative_file, flush=True)
          print("ORIGINAL_BUILTIN_EXTRA_LOAD_COMPLETE", flush=True)
          PY
          docker cp /tmp/d3_builtin_order.py "${container}:/tmp/d3_builtin_order.py"
          set +e
          docker exec \
            -e PYTHONPATH=/run/comfy-runtime/smoke_import_blocker \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONFAULTHANDLER=1 \
            -e OMP_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            "${container}" \
            timeout 120s python3.11 -X faulthandler /tmp/d3_builtin_order.py >/tmp/d3-builtin.log 2>&1
          code=$?
          set -e
          tail -n 200 /tmp/d3-builtin.log
          if grep -F "RuntimeError: Found no NVIDIA driver" /tmp/d3-builtin.log \
            && ! grep -F "LOADING_BUILTIN_EXTRA=" /tmp/d3-builtin.log; then
            echo "::error::cpu_args_injection_still_broken"
            exit 1
          fi
          if [ "${code}" -eq 0 ]; then
            echo "::error::D3 original builtin extra loading did not reproduce crash"
            exit 1
          fi
          last_loading="$(grep -F "LOADING_BUILTIN_EXTRA=" /tmp/d3-builtin.log | tail -n 1 | sed 's/.*LOADING_BUILTIN_EXTRA=//')"
          last_loaded="$(grep -F "LOADED_BUILTIN_EXTRA=" /tmp/d3-builtin.log | tail -n 1 | sed 's/.*LOADED_BUILTIN_EXTRA=//')"
          echo "d3_last_loading=${last_loading}"
          echo "d3_last_loaded=${last_loaded}"
          if [ -z "${last_loading}" ]; then
            echo "::error::D3 did not reach builtin extra loading"
            exit 1
          fi
          if [ "${last_loading}" = "${last_loaded}" ]; then
            echo "::error::D3 did not identify an unfinished builtin extra"
            exit 1
          fi
          grep -E "nodes_post_processing|kornia|Fatal Python error|Segmentation fault|torch/jit" /tmp/d3-builtin.log
          test "${last_loading}" = "comfy_extras/nodes_post_processing.py"
          echo "d3_exit_code=${code}"
          echo "d3_first_unfinished_builtin_extra=${last_loading}"
          echo "classification=original_builtin_extra_order_reaches_kornia_torchscript_crash"

      - name: D4 Production minimal node profile smoke on fixed digest
        id: d4
        shell: bash
        run: |
          set -euo pipefail
          container="comfy-runtime-d4-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            --entrypoint /bin/bash \
            -v "${PWD}/comfy-runtime:/run/comfy-runtime:ro" \
            "${COMFY_RUNTIME_IMAGE}" \
            -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() {
            docker exec "${container}" sh -lc 'tail -n 200 /tmp/d4-profile.log 2>/dev/null || true' || true
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker exec \
            -e COMFY_RUNTIME_DIR=/run/comfy-runtime \
            -e COMFY_RUNTIME_MODE=smoke_cpu \
            -e COMFY_NODE_PROFILE=production_minimal \
            -e PYTHONPATH=/run/comfy-runtime/smoke_import_blocker \
            -e PYTHONUNBUFFERED=1 \
            -e PYTHONFAULTHANDLER=1 \
            -e OMP_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            "${container}" \
            sh -lc 'cd /opt/ComfyUI && python3.11 -X faulthandler /run/comfy-runtime/launch_comfy.py --node-profile production_minimal --cpu --disable-triton-backend --disable-all-custom-nodes --listen 127.0.0.1 --port 8188 --input-directory /workspace/comfy-input --output-directory /workspace/comfy-output --user-directory /workspace/comfy-user --models-directory /workspace/models --disable-auto-launch --preview-method none --log-stdout --verbose DEBUG >/tmp/d4-profile.log 2>&1 & echo $! >/tmp/d4-profile.pid'

          ready=false
          started_at="$(date +%s)"
          for attempt in $(seq 1 60); do
            if ! docker exec "${container}" sh -lc 'kill -0 "$(cat /tmp/d4-profile.pid)" 2>/dev/null'; then
              echo "::error::D4 production minimal profile process exited"
              docker exec "${container}" tail -n 200 /tmp/d4-profile.log || true
              exit 1
            fi
            if docker exec "${container}" curl -fsS http://127.0.0.1:8188/system_stats >/tmp/d4-system-stats.json; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "${ready}" != "true" ]; then
            echo "::error::D4 production minimal profile did not become healthy"
            docker exec "${container}" tail -n 200 /tmp/d4-profile.log || true
            exit 1
          fi
          seconds="$(( $(date +%s) - started_at ))"
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/object_info >/tmp/d4-object-info.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/queue >/tmp/d4-queue.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/history >/tmp/d4-history.json
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8188/free -H 'Content-Type: application/json' -d '{"unload_models":false,"free_memory":false}' >/tmp/d4-free.json
          docker exec "${container}" sh -lc 'grep -F "node_profile=production_minimal" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc 'grep -F "profile_sha256=30f0858066f0681a25d5cceed79211582a36c154b8433d7ebc312bbda7a2daba" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc 'grep -F "comfy_args_ready cpu=True listen=127.0.0.1 port=8188" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc 'grep -F "comfy_cpu_state=CPU torch_device=cpu" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc 'grep -F "PROFILE_REQUIRED_NODE_CLASSES_OK" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc 'grep -F "Triton intentionally unavailable in COMFY_RUNTIME_MODE=smoke_cpu" /tmp/d4-profile.log || true'
          docker exec "${container}" sh -lc '! grep -F "nodes_post_processing.py" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc '! grep -F "Fatal Python error" /tmp/d4-profile.log'
          docker exec "${container}" sh -lc '! find /workspace/models -type f | grep .'
          docker exec "${container}" sh -lc '! find /workspace/comfy-output -type f | grep .'
          docker exec -i "${container}" python3.11 - <<'PY'
          import json

          with open("/tmp/d4-object-info.json", "r", encoding="utf-8") as handle:
              object_info = json.load(handle)
          required = {
              "CLIPLoader",
              "CLIPTextEncode",
              "DualCLIPLoader",
              "FluxGuidance",
              "FluxKontextImageScale",
              "KSampler",
              "KSamplerAdvanced",
              "LoadImage",
              "ModelSamplingSD3",
              "SaveAnimatedWEBP",
              "SaveImage",
              "SaveWEBM",
              "UNETLoader",
              "VAEDecode",
              "VAELoader",
              "Wan22ImageToVideoLatent",
              "WanImageToVideo",
          }
          missing = sorted(required.difference(object_info))
          if missing:
              raise SystemExit("missing Comfy node classes: " + ", ".join(missing))
          PY
          docker exec "${container}" sh -lc 'kill -TERM "$(cat /tmp/d4-profile.pid)"'
          for attempt in $(seq 1 10); do
            if ! docker exec "${container}" sh -lc 'kill -0 "$(cat /tmp/d4-profile.pid)" 2>/dev/null'; then
              break
            fi
            sleep 3
          done
          docker exec "${container}" sh -lc '! kill -0 "$(cat /tmp/d4-profile.pid)" 2>/dev/null'
          echo "d4_start_seconds=${seconds}"
          echo "classification=production_minimal_profile_smoke_passed"
          echo "gate_passed=true" >> "$GITHUB_OUTPUT"

  build-node-profile-runtime:
    name: Build production node profile runtime
    needs: diagnose-node-profile-fixed-digest
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && needs.diagnose-node-profile-fixed-digest.outputs.gate_passed == 'true' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.image }}
      version_tag: ${{ steps.image.outputs.version_tag }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      digest: ${{ steps.build.outputs.digest }}
      kornia_version: ${{ steps.locks.outputs.kornia_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static verification
        run: |
          npm run secret:scan
          npm run generation:node-profile:test

      - name: Confirm exact Kornia lock from diagnosis
        id: locks
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ needs.diagnose-node-profile-fixed-digest.outputs.kornia_version }}"
          echo "kornia_version=${{ needs.diagnose-node-profile-fixed-digest.outputs.kornia_version }}"
          echo "kornia_version=${{ needs.diagnose-node-profile-fixed-digest.outputs.kornia_version }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ai-creative-comfy-runtime"
          version_tag="v0.1.3-production-minimal-${GITHUB_SHA::7}"
          sha_tag="sha-${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "version_tag=${version_tag}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${image}:${version_tag},${image}:${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Comfy runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./comfy-runtime
          file: ./comfy-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            KORNIA_VERSION=${{ needs.diagnose-node-profile-fixed-digest.outputs.kornia_version }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=comfy-runtime
          cache-to: type=gha,mode=max,scope=comfy-runtime

      - name: Static image safety scan
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker pull --platform linux/amd64 "${image}"
          container="comfy-runtime-node-profile-scan-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" --entrypoint /bin/bash "${image}" -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -path "*/models/*" -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc 'test ! -e /.env && test ! -e /.env.local && test ! -e /.secrets'
          docker exec "${container}" sh -lc '! find /opt/comfy-runtime -type f | grep -E "CLORE_API_KEY|SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|R2_ACCESS_KEY|SSH_PRIVATE"'

      - name: Summarize image
        shell: bash
        run: |
          {
            echo "### Production node profile Comfy Runtime image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Version tag: \`${{ steps.image.outputs.version_tag }}\`"
            echo "- Commit tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- ComfyUI commit: \`da2608926eaf68fd532bba4e1ace3402c5d21399\`"
            echo "- Node profile: \`production_minimal\`"
            echo "- Model weights in image: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-node-profile-runtime:
    name: Verify production node profile runtime
    needs: build-node-profile-runtime
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && needs.build-node-profile-runtime.outputs.digest != '' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Pull public digest anonymously
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config-node-profile-verify"
          mkdir -p "${DOCKER_CONFIG}"
          printf '{}\n' > "${DOCKER_CONFIG}/config.json"
          image="${{ needs.build-node-profile-runtime.outputs.image }}@${{ needs.build-node-profile-runtime.outputs.digest }}"
          docker buildx imagetools inspect "${image}" >/tmp/node-profile-runtime-inspect.txt
          grep -F "linux/amd64" /tmp/node-profile-runtime-inspect.txt
          docker pull --platform linux/amd64 "${image}"

      - name: Smoke CPU production node profile runtime
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.build-node-profile-runtime.outputs.image }}@${{ needs.build-node-profile-runtime.outputs.digest }}"
          container="comfy-runtime-node-profile-smoke-${GITHUB_RUN_ID}"
          started_at="$(date +%s)"
          docker run -d --name "${container}" \
            -e START_GPU_WORKER=false \
            -e COMFY_RUNTIME_MODE=smoke_cpu \
            -e COMFY_NODE_PROFILE=production_minimal \
            -p 127.0.0.1:8080:8080 \
            "${image}"
          cleanup() {
            docker exec "${container}" sh -lc 'for file in /workspace/logs/*.log; do case "${file}" in *environment-redacted.log) continue ;; esac; echo "===== ${file}"; tail -n 200 "${file}" || true; done' || true
            docker logs --tail 200 "${container}" || true
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if docker ps --format '{{.Names}}' | grep -Fx "${container}" >/dev/null \
              && curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/comfy-health.json | grep -F "\"ok\": true"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "true" ]; then
            echo "::error::Production node profile runtime did not become healthy in time"
            exit 1
          fi
          seconds="$(( $(date +%s) - started_at ))"
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/object_info >/tmp/object-info.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/system_stats >/tmp/system-stats.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/history >/tmp/history.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/queue >/tmp/queue.json
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8188/free -H 'Content-Type: application/json' -d '{"unload_models":false,"free_memory":false}' >/tmp/free.json
          docker exec "${container}" sh -lc 'grep -F "node_profile=production_minimal" /workspace/logs/comfyui.log'
          docker exec "${container}" sh -lc 'grep -F "workflow_manifest_sha256=acb0a624f433a174366bc2820ab835c34273f0c102acc0651b09f75e800ca5d5" /workspace/logs/comfyui.log'
          docker exec "${container}" sh -lc 'grep -F "PROFILE_REQUIRED_NODE_CLASSES_OK" /workspace/logs/comfyui.log'
          docker exec "${container}" python3.11 -c 'import importlib.metadata as m; assert m.version("kornia") == "${{ needs.build-node-profile-runtime.outputs.kornia_version }}"'
          docker exec "${container}" sh -lc '! grep -F "nodes_post_processing.py" /workspace/logs/comfyui.log'
          docker exec "${container}" sh -lc '! grep -F "Fatal Python error" /workspace/logs/comfyui.log'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import base64
          import os
          import socket

          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              "GET /ws?clientId=ci-node-profile-smoke HTTP/1.1\r\n"
              "Host: 127.0.0.1:8188\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 8188), timeout=10) as sock:
              sock.sendall(request.encode())
              response = sock.recv(512).decode(errors="replace")
          if " 101 " not in response.split("\r\n", 1)[0]:
              raise SystemExit(response)
          PY'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json
          import urllib.error
          import urllib.request

          body = json.dumps({"prompt": {"bad": {"class_type": "MissingNodeForSmoke", "inputs": {}}}}).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8188/prompt",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10).read()
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode(errors="replace")
              if exc.code != 400 or "MissingNodeForSmoke" not in payload:
                  raise
          else:
              raise SystemExit("invalid prompt unexpectedly accepted")
          PY'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json

          with open("/tmp/object-info.json", "r", encoding="utf-8") as handle:
              object_info = json.load(handle)
          required = {
              "CLIPLoader",
              "CLIPTextEncode",
              "DualCLIPLoader",
              "FluxGuidance",
              "FluxKontextImageScale",
              "KSampler",
              "KSamplerAdvanced",
              "LoadImage",
              "ModelSamplingSD3",
              "SaveAnimatedWEBP",
              "SaveImage",
              "SaveWEBM",
              "UNETLoader",
              "VAEDecode",
              "VAELoader",
              "Wan22ImageToVideoLatent",
              "WanImageToVideo",
          }
          missing = sorted(required.difference(object_info))
          if missing:
              raise SystemExit("missing Comfy node classes: " + ", ".join(missing))
          PY'
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8080/interrupt >/tmp/interrupt.json
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -path "*/models/*" -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc '! printenv | grep -E "SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|CLORE_API_KEY|R2_ADMIN|SSH_PRIVATE"'
          docker exec "${container}" sh -lc 'test ! -e /app/worker.py'
          docker stop --time 15 "${container}" >/dev/null
          echo "node_profile_smoke_start_seconds=${seconds}"

      - name: GPU mode fail-closed without smoke blocker
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.build-node-profile-runtime.outputs.image }}@${{ needs.build-node-profile-runtime.outputs.digest }}"
          set +e
          docker run --rm -e COMFY_RUNTIME_MODE=gpu -e COMFY_NODE_PROFILE=production_minimal -e COMFY_GPU_PROFILE=rtx4090 "${image}" >/tmp/gpu-negative.log 2>&1
          code=$?
          set -e
          cat /tmp/gpu-negative.log
          test "${code}" -ne 0
          test "${code}" -eq 42
          grep -F "gpu_preflight_failed" /tmp/gpu-negative.log
          ! grep -F "Triton intentionally unavailable in COMFY_RUNTIME_MODE=smoke_cpu" /tmp/gpu-negative.log
          ! grep -F "starting ComfyUI runtime" /tmp/gpu-negative.log

      - name: Summarize production node profile verification
        shell: bash
        run: |
          {
            echo "### Production node profile runtime verification"
            echo ""
            echo "- Image: \`${{ needs.build-node-profile-runtime.outputs.image }}\`"
            echo "- Version tag: \`${{ needs.build-node-profile-runtime.outputs.version_tag }}\`"
            echo "- Digest: \`${{ needs.build-node-profile-runtime.outputs.digest }}\`"
            echo "- Kornia lock: \`${{ needs.build-node-profile-runtime.outputs.kornia_version }}\`"
            echo "- Anonymous pull: \`true\`"
            echo "- Node profile: \`production_minimal\`"
            echo "- CPU no-model smoke: \`true\`"
            echo "- GPU no-device fail-closed: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.image }}
      version_tag: ${{ steps.image.outputs.version_tag }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ai-creative-comfy-runtime"
          version_tag="${{ inputs.version_tag }}"
          if [ -z "${version_tag}" ]; then
            version_tag="v0.1.2-no-model-runtime-${GITHUB_SHA::7}"
          fi
          sha_tag="sha-${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "version_tag=${version_tag}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${image}:${version_tag},${image}:${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Comfy runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./comfy-runtime
          file: ./comfy-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=comfy-runtime
          cache-to: type=gha,mode=max,scope=comfy-runtime

      - name: Static image safety scan
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker pull --platform linux/amd64 "${image}"
          container="comfy-runtime-scan-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" --entrypoint /bin/bash "${image}" -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -path "*/models/*" -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc 'test ! -e /.env && test ! -e /.env.local && test ! -e /.secrets'
          docker rm -f "${container}" >/dev/null

      - name: Summarize image
        shell: bash
        run: |
          {
            echo "### Comfy Runtime image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Version tag: \`${{ steps.image.outputs.version_tag }}\`"
            echo "- Commit tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- ComfyUI commit: \`da2608926eaf68fd532bba4e1ace3402c5d21399\`"
            echo "- Model weights in image: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public-digest:
    needs: build-and-push
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Pull public digest anonymously
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config"
          mkdir -p "${DOCKER_CONFIG}"
          image="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          docker buildx imagetools inspect "${image}" >/tmp/comfy-runtime-inspect.txt
          grep -F "linux/amd64" /tmp/comfy-runtime-inspect.txt >/dev/null
          docker pull --platform linux/amd64 "${image}"

      - name: Smoke CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config"
          image="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          container="comfy-runtime-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            -e START_GPU_WORKER=false \
            -e COMFY_RUNTIME_MODE=smoke_cpu \
            -p 127.0.0.1:8080:8080 \
            "${image}"
          cleanup() {
            docker exec "${container}" sh -lc 'for file in /workspace/logs/*.log; do case "${file}" in *environment-redacted.log) continue ;; esac; echo "===== ${file}"; tail -n 200 "${file}" || true; done' || true
            docker logs --tail 200 "${container}" || true
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if docker ps --format '{{.Names}}' | grep -Fx "${container}" >/dev/null \
              && curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/comfy-health.json | grep -F "\"ok\": true"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "true" ]; then
            echo "::error::Comfy runtime did not become healthy in time"
            exit 1
          fi
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/object_info >/tmp/object-info.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/system_stats >/tmp/system-stats.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/history >/tmp/history.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/queue >/tmp/queue.json
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8188/free -H 'Content-Type: application/json' -d '{"unload_models":false,"free_memory":false}' >/tmp/free.json
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import base64
          import os
          import socket

          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              "GET /ws?clientId=ci-smoke HTTP/1.1\r\n"
              "Host: 127.0.0.1:8188\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 8188), timeout=10) as sock:
              sock.sendall(request.encode())
              response = sock.recv(512).decode(errors="replace")
          if " 101 " not in response.split("\r\n", 1)[0]:
              raise SystemExit(response)
          PY'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json
          import urllib.error
          import urllib.request

          body = json.dumps({"prompt": {"bad": {"class_type": "MissingNodeForSmoke", "inputs": {}}}}).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8188/prompt",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10).read()
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode(errors="replace")
              if exc.code != 400 or "MissingNodeForSmoke" not in payload:
                  raise
          else:
              raise SystemExit("invalid prompt unexpectedly accepted")
          PY'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json

          with open("/tmp/object-info.json", "r", encoding="utf-8") as handle:
              object_info = json.load(handle)
          required = {
              "CLIPLoader",
              "CLIPTextEncode",
              "DualCLIPLoader",
              "FluxGuidance",
              "FluxKontextImageScale",
              "KSampler",
              "KSamplerAdvanced",
              "LoadImage",
              "ModelSamplingSD3",
              "SaveAnimatedWEBP",
              "SaveImage",
              "SaveWEBM",
              "UNETLoader",
              "VAEDecode",
              "VAELoader",
              "Wan22ImageToVideoLatent",
              "WanImageToVideo",
          }
          missing = sorted(required.difference(object_info))
          if missing:
              raise SystemExit("missing Comfy node classes: " + ", ".join(missing))
          PY'
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8080/interrupt >/tmp/interrupt.json
          docker inspect "${container}" > /tmp/inspect.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/inspect.json", "r", encoding="utf-8"))[0]
          ports = data["HostConfig"]["PortBindings"]
          if "8188/tcp" in ports:
              raise SystemExit("8188 must not be published")
          binding = ports.get("8080/tcp", [])
          if not binding or binding[0].get("HostIp") != "127.0.0.1":
              raise SystemExit("8080 must bind only to host 127.0.0.1")
          PY
          docker exec "${container}" sh -lc 'test "$(printenv COMFYUI_COMMIT)" = "da2608926eaf68fd532bba4e1ace3402c5d21399"'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -path "*/models/*" -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc '! printenv | grep -E "SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|CLORE_API_KEY|R2_ADMIN|SSH_PRIVATE"'
          docker exec "${container}" sh -lc 'test ! -e /app/worker.py'
          docker exec "${container}" python3.11 -c 'import pathlib,sys; forbidden=False
          for path in ("/proc/net/tcp","/proc/net/tcp6"):
            for line in pathlib.Path(path).read_text().splitlines()[1:]:
              local=line.split()[1]; host_hex,port_hex=local.rsplit(":",1)
              forbidden = forbidden or (int(port_hex,16)==8188 and set(host_hex) <= {"0"})
          sys.exit(1 if forbidden else 0)'
          top_output="$(docker top "${container}")"
          if printf '%s\n' "${top_output}" | grep -Eq 'python(3)?[[:space:]]+/app/worker[.]py'; then
            echo "::error::legacy Wan worker unexpectedly started"
            exit 1
          fi

          docker stop --time 15 "${container}" >/dev/null
          if docker ps -a --format '{{.Names}}' | grep -Fx "${container}" >/dev/null; then
            state="$(docker inspect --format '{{.State.Status}}' "${container}")"
            test "${state}" = "exited"
          fi

      - name: GPU mode fail-closed
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          set +e
          docker run --rm -e COMFY_RUNTIME_MODE=gpu "${image}" >/tmp/gpu-negative.log 2>&1
