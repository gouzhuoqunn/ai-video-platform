name: Comfy Runtime Image

on:
  push:
    branches:
      - stage-two-five-comfy-runtime
    paths:
      - ".github/workflows/comfy-runtime-image.yml"
      - "comfy-runtime/**"
      - "scripts/comfy-runtime-contract-tests.ts"
      - "scripts/workflow-asset-tests.ts"
      - "src/lib/generation/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Immutable ComfyUI runtime tag"
        required: false
        default: ""
      verify_existing_digest:
        description: "Existing sha256 digest to verify without rebuilding"
        required: false
        default: ""
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - ci/comfy-runtime-smoke-base

permissions:
  contents: read

concurrency:
  group: comfy-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')) }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.image }}
      version_tag: ${{ steps.image.outputs.version_tag }}
      sha_tag: ${{ steps.image.outputs.sha_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/ai-creative-comfy-runtime"
          version_tag="${{ inputs.version_tag }}"
          if [ -z "${version_tag}" ]; then
            version_tag="v0.1.2-no-model-runtime-${GITHUB_SHA::7}"
          fi
          sha_tag="sha-${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "version_tag=${version_tag}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${image}:${version_tag},${image}:${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Comfy runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./comfy-runtime
          file: ./comfy-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=comfy-runtime
          cache-to: type=gha,mode=max,scope=comfy-runtime

      - name: Static image safety scan
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker pull --platform linux/amd64 "${image}"
          container="comfy-runtime-scan-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" --entrypoint /bin/bash "${image}" -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() { docker rm -f "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -path "*/models/*" -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc 'test ! -e /.env && test ! -e /.env.local && test ! -e /.secrets'
          docker rm -f "${container}" >/dev/null

      - name: Summarize image
        shell: bash
        run: |
          {
            echo "### Comfy Runtime image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Version tag: \`${{ steps.image.outputs.version_tag }}\`"
            echo "- Commit tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- ComfyUI commit: \`da2608926eaf68fd532bba4e1ace3402c5d21399\`"
            echo "- Model weights in image: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-public-digest:
    needs: build-and-push
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.ref == 'refs/heads/stage-two-five-comfy-runtime' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip build]')) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Pull public digest anonymously
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config"
          mkdir -p "${DOCKER_CONFIG}"
          image="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          docker buildx imagetools inspect "${image}" >/tmp/comfy-runtime-inspect.txt
          grep -F "linux/amd64" /tmp/comfy-runtime-inspect.txt >/dev/null
          docker pull --platform linux/amd64 "${image}"

      - name: Smoke CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config"
          image="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          container="comfy-runtime-smoke-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            -e START_GPU_WORKER=false \
            -e COMFY_RUNTIME_MODE=smoke_cpu \
            -p 127.0.0.1:8080:8080 \
            "${image}"
          cleanup() {
            docker exec "${container}" sh -lc 'for file in /workspace/logs/*.log; do case "${file}" in *environment-redacted.log) continue ;; esac; echo "===== ${file}"; tail -n 200 "${file}" || true; done' || true
            docker logs --tail 200 "${container}" || true
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if docker ps --format '{{.Names}}' | grep -Fx "${container}" >/dev/null \
              && curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/comfy-health.json | grep -F "\"ok\": true"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "${ready}" != "true" ]; then
            echo "::error::Comfy runtime did not become healthy in time"
            exit 1
          fi
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/object_info >/tmp/object-info.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/system_stats >/tmp/system-stats.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/history >/tmp/history.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/queue >/tmp/queue.json
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8188/free -H 'Content-Type: application/json' -d '{"unload_models":false,"free_memory":false}' >/tmp/free.json
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import base64
          import os
          import socket

          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              "GET /ws?clientId=ci-smoke HTTP/1.1\r\n"
              "Host: 127.0.0.1:8188\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 8188), timeout=10) as sock:
              sock.sendall(request.encode())
              response = sock.recv(512).decode(errors="replace")
          if " 101 " not in response.split("\r\n", 1)[0]:
              raise SystemExit(response)
          PY'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json
          import urllib.error
          import urllib.request

          body = json.dumps({"prompt": {"bad": {"class_type": "MissingNodeForSmoke", "inputs": {}}}}).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8188/prompt",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10).read()
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode(errors="replace")
              if exc.code != 400 or "MissingNodeForSmoke" not in payload:
                  raise
          else:
              raise SystemExit("invalid prompt unexpectedly accepted")
          PY'
          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json

          with open("/tmp/object-info.json", "r", encoding="utf-8") as handle:
              object_info = json.load(handle)
          required = {
              "CLIPLoader",
              "CLIPTextEncode",
              "DualCLIPLoader",
              "FluxGuidance",
              "FluxKontextImageScale",
              "KSampler",
              "KSamplerAdvanced",
              "LoadImage",
              "ModelSamplingSD3",
              "SaveAnimatedWEBP",
              "SaveImage",
              "SaveWEBM",
              "UNETLoader",
              "VAEDecode",
              "VAELoader",
              "Wan22ImageToVideoLatent",
              "WanImageToVideo",
          }
          missing = sorted(required.difference(object_info))
          if missing:
              raise SystemExit("missing Comfy node classes: " + ", ".join(missing))
          PY'
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8080/interrupt >/tmp/interrupt.json
          docker inspect "${container}" > /tmp/inspect.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/inspect.json", "r", encoding="utf-8"))[0]
          ports = data["HostConfig"]["PortBindings"]
          if "8188/tcp" in ports:
              raise SystemExit("8188 must not be published")
          binding = ports.get("8080/tcp", [])
          if not binding or binding[0].get("HostIp") != "127.0.0.1":
              raise SystemExit("8080 must bind only to host 127.0.0.1")
          PY
          docker exec "${container}" sh -lc 'test "$(printenv COMFYUI_COMMIT)" = "da2608926eaf68fd532bba4e1ace3402c5d21399"'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -path "*/models/*" -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc '! printenv | grep -E "SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|CLORE_API_KEY|R2_ADMIN|SSH_PRIVATE"'
          docker exec "${container}" sh -lc 'test ! -e /app/worker.py'
          docker exec "${container}" python3.11 -c 'import pathlib,sys; forbidden=False
          for path in ("/proc/net/tcp","/proc/net/tcp6"):
            for line in pathlib.Path(path).read_text().splitlines()[1:]:
              local=line.split()[1]; host_hex,port_hex=local.rsplit(":",1)
              forbidden = forbidden or (int(port_hex,16)==8188 and set(host_hex) <= {"0"})
          sys.exit(1 if forbidden else 0)'
          top_output="$(docker top "${container}")"
          if printf '%s\n' "${top_output}" | grep -Eq 'python(3)?[[:space:]]+/app/worker[.]py'; then
            echo "::error::legacy Wan worker unexpectedly started"
            exit 1
          fi

          docker stop --time 15 "${container}" >/dev/null
          if docker ps -a --format '{{.Names}}' | grep -Fx "${container}" >/dev/null; then
            state="$(docker inspect --format '{{.State.Status}}' "${container}")"
            test "${state}" = "exited"
          fi

      - name: GPU mode fail-closed
        shell: bash
        run: |
          set -euo pipefail
          image="${{ needs.build-and-push.outputs.image }}@${{ needs.build-and-push.outputs.digest }}"
          set +e
          docker run --rm -e COMFY_RUNTIME_MODE=gpu "${image}" >/tmp/gpu-negative.log 2>&1
          code=$?
          set -e
          cat /tmp/gpu-negative.log
          test "${code}" -ne 0
          grep -F "gpu_preflight_failed" /tmp/gpu-negative.log

      - name: Summarize verification
        shell: bash
        run: |
          {
            echo "### Public digest verification"
            echo ""
            echo "- Image: \`${{ needs.build-and-push.outputs.image }}\`"
            echo "- Version tag: \`${{ needs.build-and-push.outputs.version_tag }}\`"
            echo "- Digest: \`${{ needs.build-and-push.outputs.digest }}\`"
            echo "- Anonymous pull: \`true\`"
            echo "- CPU no-model smoke: \`true\`"
            echo "- GPU no-device fail-closed: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-existing-digest-smoke:
    name: Verify existing digest smoke
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'gouzhuoqunn/ai-video-platform' && github.head_ref == 'stage-two-five-comfy-runtime' && github.base_ref == 'ci/comfy-runtime-smoke-base' && !contains(github.event.pull_request.title, '[diagnose-only]') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMFY_RUNTIME_IMAGE: ghcr.io/gouzhuoqunn/ai-creative-comfy-runtime@sha256:d88dd518253f27ac8a7841d07b2e02c79a8cda0a940c85b9c579446f105c26bc
    steps:
      - name: Verify PR event guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "gouzhuoqunn/ai-video-platform"
          test "${{ github.head_ref }}" = "stage-two-five-comfy-runtime"
          test "${{ github.base_ref }}" = "ci/comfy-runtime-smoke-base"

      - name: Confirm verify-only mode
        shell: bash
        run: |
          set -euo pipefail
          echo "build=skipped"
          echo "push=skipped"
          echo "image=${COMFY_RUNTIME_IMAGE}"

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Pull fixed digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${COMFY_RUNTIME_IMAGE}"

      - name: Smoke fixed digest
        shell: bash
        run: |
          set -euo pipefail
          container="comfy-runtime-pr-smoke-${GITHUB_RUN_ID}"
          started_at="$(date +%s)"

          diagnose() {
            echo "===== docker inspect state"
            docker inspect --format '{{json .State}}' "${container}" 2>/dev/null || true
            echo "===== container logs"
            docker logs --tail 200 "${container}" 2>/dev/null || true
            if docker ps --format '{{.Names}}' | grep -Fx "${container}" >/dev/null 2>&1; then
              docker exec "${container}" sh -lc 'for file in /workspace/logs/*.log; do case "${file}" in *environment-redacted.log) continue ;; esac; echo "===== ${file}"; tail -n 200 "${file}" || true; done' || true
            fi
          }

          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "${container}" \
            -e START_GPU_WORKER=false \
            -e COMFYUI_EXTRA_ARGS=--cpu \
            "${COMFY_RUNTIME_IMAGE}"

          ready=false
          for attempt in $(seq 1 60); do
            if ! docker ps --format '{{.Names}}' | grep -Fx "${container}" >/dev/null; then
              echo "::error::Comfy runtime container exited before health check"
              diagnose
              exit 1
            fi
            if docker exec "${container}" sh -lc 'curl -fsS http://127.0.0.1:8080/healthz | tee /tmp/comfy-health.json | grep -F "\"ok\": true"'; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "${ready}" != "true" ]; then
            echo "::error::Comfy runtime did not become healthy in 300 seconds"
            diagnose
            exit 1
          fi

          startup_seconds="$(( $(date +%s) - started_at ))"
          echo "startup_seconds=${startup_seconds}" | tee /tmp/startup-seconds.txt

          docker exec "${container}" curl -fsS http://127.0.0.1:8080/healthz >/tmp/controller-health.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/object_info >/tmp/object-info.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/system_stats >/tmp/system-stats.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/history >/tmp/history.json
          docker exec "${container}" curl -fsS http://127.0.0.1:8188/queue >/tmp/queue.json
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8188/free -H 'Content-Type: application/json' -d '{"unload_models":false,"free_memory":false}' >/tmp/free.json
          docker exec "${container}" curl -fsS -X POST http://127.0.0.1:8080/interrupt >/tmp/interrupt.json

          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import base64
          import os
          import socket

          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              "GET /ws?clientId=ci-smoke HTTP/1.1\r\n"
              "Host: 127.0.0.1:8188\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n\r\n"
          )
          with socket.create_connection(("127.0.0.1", 8188), timeout=10) as sock:
              sock.sendall(request.encode())
              response = sock.recv(512).decode(errors="replace")
          if " 101 " not in response.split("\r\n", 1)[0]:
              raise SystemExit(response)
          PY'

          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json
          import urllib.error
          import urllib.request

          body = json.dumps({"prompt": {"bad": {"class_type": "MissingNodeForSmoke", "inputs": {}}}}).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8188/prompt",
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=10).read()
          except urllib.error.HTTPError as exc:
              payload = exc.read().decode(errors="replace")
              if exc.code != 400 or "MissingNodeForSmoke" not in payload:
                  raise
          else:
              raise SystemExit("invalid prompt unexpectedly accepted")
          PY'

          docker exec "${container}" sh -lc 'python3.11 - <<'"'"'PY'"'"'
          import json

          with open("/tmp/object-info.json", "r", encoding="utf-8") as handle:
              object_info = json.load(handle)
          required = {
              "CLIPLoader",
              "CLIPTextEncode",
              "DualCLIPLoader",
              "FluxGuidance",
              "FluxKontextImageScale",
              "KSampler",
              "KSamplerAdvanced",
              "LoadImage",
              "ModelSamplingSD3",
              "SaveAnimatedWEBP",
              "SaveImage",
              "SaveWEBM",
              "UNETLoader",
              "VAEDecode",
              "VAELoader",
              "Wan22ImageToVideoLatent",
              "WanImageToVideo",
          }
          missing = sorted(required.difference(object_info))
          if missing:
              raise SystemExit("missing Comfy node classes: " + ", ".join(missing))
          PY'

          docker exec "${container}" sh -lc 'test "$(printenv COMFYUI_COMMIT)" = "da2608926eaf68fd532bba4e1ace3402c5d21399"'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f \( -name "*.safetensors" -o -name "*.ckpt" -o -name "*.pth" -o -name "*.gguf" \) | grep .'
          docker exec "${container}" sh -lc '! find /workspace /opt/comfy-runtime -type f -name "*.bin" -size +50M | grep .'
          docker exec "${container}" sh -lc '! printenv | grep -E "SUPABASE_SERVICE_ROLE|SUPABASE_SECRET|CLORE_API_KEY|R2_ADMIN|SSH_PRIVATE"'
          docker exec "${container}" sh -lc 'test ! -e /app/worker.py'
          top_output="$(docker top "${container}")"
          if printf '%s\n' "${top_output}" | grep -Eq 'python(3)?[[:space:]]+/app/worker[.]py'; then
            echo "::error::legacy Wan worker unexpectedly started"
            exit 1
          fi

          docker stop --time 15 "${container}" >/dev/null
          state="$(docker inspect --format '{{.State.Status}}' "${container}")"
          test "${state}" = "exited"

          {
            echo "### Fixed digest smoke"
            echo ""
            echo "- Image: \`${COMFY_RUNTIME_IMAGE}\`"
            echo "- Build: \`skipped\`"
            echo "- Push: \`skipped\`"
            echo "- Startup seconds: \`${startup_seconds}\`"
            echo "- API/WebSocket/nodes: \`passed\`"
            echo "- Model weights in image: \`false\`"
            echo "- Repository secrets used: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

  diagnose-existing-digest:
    name: Diagnose existing digest
    if: ${{ github.repository == 'gouzhuoqunn/ai-video-platform' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'gouzhuoqunn/ai-video-platform' && github.head_ref == 'stage-two-five-comfy-runtime' && github.base_ref == 'ci/comfy-runtime-smoke-base' && contains(github.event.pull_request.title, '[diagnose-only]') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMFY_RUNTIME_IMAGE: ghcr.io/gouzhuoqunn/ai-creative-comfy-runtime@sha256:d88dd518253f27ac8a7841d07b2e02c79a8cda0a940c85b9c579446f105c26bc
    steps:
      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Pull fixed digest anonymously
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config"
          mkdir -p "${DOCKER_CONFIG}"
          docker pull --platform linux/amd64 "${COMFY_RUNTIME_IMAGE}"

      - name: Diagnose no-model startup
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/empty-docker-config"
          container="comfy-runtime-diagnostic-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            --entrypoint /bin/bash \
            "${COMFY_RUNTIME_IMAGE}" \
            -lc 'trap "exit 0" TERM INT; while true; do sleep 30; done'
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          dexec() {
            docker exec "${container}" "$@"
          }

          echo "===== runtime basics"
          dexec python3.11 - <<'PY'
          import importlib.metadata as metadata
          import os
          import pathlib
          import shutil
          import stat
          import subprocess
          import sys

          print("python=" + sys.version.split()[0])
          try:
              import torch
              print("torch=" + torch.__version__)
              print("torch_cuda=" + str(torch.version.cuda))
              print("torch_cuda_available=" + str(torch.cuda.is_available()))
          except Exception as exc:
              print("torch_error=" + repr(exc))
          print("nvidia_smi_exists=" + str(shutil.which("nvidia-smi") is not None))
          commit = os.environ.get("COMFYUI_COMMIT", "")
          marker = subprocess.check_output(["git", "-C", "/opt/ComfyUI", "rev-parse", "HEAD"], text=True).strip() if pathlib.Path("/opt/ComfyUI").exists() else ""
          print("comfyui_env_commit=" + commit)
          print("comfyui_git_commit=" + marker)
          for package in ["comfyui-frontend-package", "requests", "torch", "numpy", "aiohttp"]:
              try:
                  print(f"package:{package}={metadata.version(package)}")
              except metadata.PackageNotFoundError:
                  print(f"package:{package}=missing")
          for directory in ["/workspace/models", "/workspace/comfy-input", "/workspace/comfy-output", "/workspace/comfy-user", "/workspace/logs", "/tmp"]:
              path = pathlib.Path(directory)
              exists = path.exists()
              writable = os.access(path, os.R_OK | os.W_OK) if exists else False
              mode = oct(stat.S_IMODE(path.stat().st_mode)) if exists else "missing"
              owner = f"{path.stat().st_uid}:{path.stat().st_gid}" if exists else "missing"
              print(f"dir:{directory}:exists={exists}:owner={owner}:mode={mode}:rw={writable}")
          for script in ["/opt/comfy-runtime/entrypoint.sh", "/opt/comfy-runtime/controller.py", "/opt/comfy-runtime/healthcheck.py"]:
              path = pathlib.Path(script)
              print(f"script:{script}:exists={path.exists()}:exec={os.access(path, os.X_OK) if path.exists() else False}")
          PY

          echo "===== syntax checks"
          dexec bash -n /opt/comfy-runtime/entrypoint.sh
          dexec python3.11 -m compileall -q /opt/comfy-runtime

          echo "===== manual ComfyUI CPU startup"
          dexec bash -lc 'cd /opt/ComfyUI && rm -f /workspace/logs/comfyui-diagnostic.log && (python3.11 main.py --cpu --listen 127.0.0.1 --port 8188 --input-directory /workspace/comfy-input --output-directory /workspace/comfy-output --user-directory /workspace/comfy-user --models-directory /workspace/models --disable-auto-launch --preview-method none --log-stdout --verbose DEBUG > >(tee /workspace/logs/comfyui-diagnostic.log) 2>&1) & echo $! >/tmp/comfyui-diagnostic.pid'
          cpu_ready=false
          for attempt in $(seq 1 36); do
            if ! dexec bash -lc 'kill -0 "$(cat /tmp/comfyui-diagnostic.pid)" 2>/dev/null'; then
              echo "::error::manual ComfyUI CPU process exited"
              dexec bash -lc 'wait "$(cat /tmp/comfyui-diagnostic.pid)"; echo "exit_code=$?"' || true
              dexec bash -lc 'tail -n 200 /workspace/logs/comfyui-diagnostic.log || true'
              exit 1
            fi
            if dexec curl -fsS http://127.0.0.1:8188/system_stats >/tmp/system_stats.json; then
              cpu_ready=true
              break
            fi
            sleep 5
          done
          if [ "${cpu_ready}" != "true" ]; then
            echo "::error::manual ComfyUI CPU startup timed out"
            dexec bash -lc 'tail -n 200 /workspace/logs/comfyui-diagnostic.log || true'
            exit 1
          fi
          echo "manual_cpu_start_seconds=$(( attempt * 5 ))"
          dexec curl -fsS http://127.0.0.1:8188/object_info >/tmp/object_info.json

          echo "===== standalone controller"
          dexec bash -lc 'rm -f /workspace/logs/controller-diagnostic.log && (python3.11 /opt/comfy-runtime/controller.py --host 127.0.0.1 --port 8080 --comfy-host 127.0.0.1 --comfy-port 8188 > >(tee /workspace/logs/controller-diagnostic.log) 2>&1) & echo $! >/tmp/controller-diagnostic.pid'
          controller_ready=false
          for attempt in $(seq 1 24); do
            if ! dexec bash -lc 'kill -0 "$(cat /tmp/controller-diagnostic.pid)" 2>/dev/null'; then
              echo "::error::controller process exited"
              dexec bash -lc 'wait "$(cat /tmp/controller-diagnostic.pid)"; echo "exit_code=$?"' || true
              dexec bash -lc 'tail -n 200 /workspace/logs/controller-diagnostic.log || true'
              exit 1
            fi
            if dexec curl -fsS http://127.0.0.1:8080/healthz >/tmp/controller_health.json; then
              controller_ready=true
              break
            fi
            sleep 5
          done
          if [ "${controller_ready}" != "true" ]; then
            echo "::error::controller health timed out"
            dexec bash -lc 'tail -n 200 /workspace/logs/controller-diagnostic.log || true'
            exit 1
          fi

          echo "===== manual GPU negative startup"
          dexec bash -lc 'cd /opt/ComfyUI && rm -f /workspace/logs/comfyui-gpu-negative.log && timeout 40s python3.11 main.py --listen 127.0.0.1 --port 8190 --input-directory /workspace/comfy-input --output-directory /workspace/comfy-output --user-directory /workspace/comfy-user --models-directory /workspace/models --disable-auto-launch --preview-method none --log-stdout --verbose DEBUG > >(tee /workspace/logs/comfyui-gpu-negative.log) 2>&1; echo "gpu_negative_exit=$?"'
          dexec bash -lc 'tail -n 120 /workspace/logs/comfyui-gpu-negative.log || true'

          echo "===== default entrypoint reproduction"
          dexec bash -lc 'rm -f /workspace/logs/comfyui.log /workspace/logs/controller.log /workspace/logs/comfy-runtime.log; COMFYUI_EXTRA_ARGS=--cpu timeout 30s /opt/comfy-runtime/entrypoint.sh; echo "entrypoint_exit=$?"; echo "===== comfy-runtime.log"; tail -n 200 /workspace/logs/comfy-runtime.log || true; echo "===== comfyui.log"; tail -n 200 /workspace/logs/comfyui.log || true; echo "===== controller.log"; tail -n 200 /workspace/logs/controller.log || true'
