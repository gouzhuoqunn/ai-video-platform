name: FLUX 4090 Model Cache

on:
  push:
    branches:
      - stage-two-five-comfy-runtime
    paths:
      - ".github/workflows/flux4090-model-cache.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/flux-first-image.ts"
      - "scripts/first-image-preflight.ts"
      - "scripts/first-image-preflight-tests.ts"
      - "scripts/model-cache/**"
  workflow_dispatch:

concurrency:
  group: flux4090-model-cache
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL_CACHE_REGION: auto
  MODEL_CACHE_PREFIX: production/rtx4090/image

jobs:
  verify-existing-flux:
    name: Verify existing FLUX 4B object
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      flux_verified: ${{ steps.verify.outputs.flux_verified }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_READONLY_ACCESS_KEY_ID: ${{ secrets.R2_READONLY_ACCESS_KEY_ID }}
      R2_READONLY_SECRET_ACCESS_KEY: ${{ secrets.R2_READONLY_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - name: Verify completed FLUX object without downloading
        id: verify
        run: |
          npm run model-cache:verify-object:flux4090 -- flux
          echo "flux_verified=true" >> "$GITHUB_OUTPUT"

  cache-qwen:
    name: Cache Qwen FLUX text encoder
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      qwen_verified: ${{ steps.upload.outputs.qwen_verified }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Qwen Hugging Face cache directory
        run: echo "HF_HOME=$RUNNER_TEMP/hf-qwen" >> "$GITHUB_ENV"

      - name: Reclaim runner disk
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /opt/ghc
          docker system prune --all --force || true
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check "huggingface_hub[hf_xet]>=0.30,<2"

      - name: Require 11 GiB free disk
        run: npm run model-cache:disk-guard:flux4090 -- 11

      - name: Download locked Qwen with official Hugging Face client
        id: download
        run: timeout --signal=TERM --kill-after=30s 30m python scripts/model-cache/hf_download_model.py --model qwen --cache-dir "$HF_HOME" --github-output "$GITHUB_OUTPUT" --max-minutes 30 --stall-minutes 10

      - name: Verify complete Qwen SHA256
        run: timeout --signal=TERM --kill-after=30s 8m npm run model-cache:validate-local:flux4090 -- qwen "${{ steps.download.outputs.model_path }}"

      - name: Upload and verify Qwen with AWS SDK
        id: upload
        run: |
          timeout --signal=TERM --kill-after=30s 20m npm run model-cache:upload-local:flux4090 -- qwen "${{ steps.download.outputs.model_path }}"
          echo "qwen_verified=true" >> "$GITHUB_OUTPUT"

      - name: Remove Qwen and Hugging Face cache
        if: always()
        run: |
          rm -f -- "${{ steps.download.outputs.model_path }}"
          rm -rf -- "$HF_HOME"

  cache-vae:
    name: Cache FLUX VAE
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      vae_verified: ${{ steps.upload.outputs.vae_verified }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VAE Hugging Face cache directory
        run: echo "HF_HOME=$RUNNER_TEMP/hf-vae" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check "huggingface_hub[hf_xet]>=0.30,<2"

      - name: Check runner disk
        run: |
          df -h
          npm run model-cache:disk-guard:flux4090 -- 3

      - name: Download locked VAE with official Hugging Face client
        id: download
        run: timeout --signal=TERM --kill-after=30s 10m python scripts/model-cache/hf_download_model.py --model vae --cache-dir "$HF_HOME" --github-output "$GITHUB_OUTPUT" --max-minutes 10 --stall-minutes 5

      - name: Verify complete VAE SHA256
        run: timeout --signal=TERM --kill-after=30s 3m npm run model-cache:validate-local:flux4090 -- vae "${{ steps.download.outputs.model_path }}"

      - name: Upload and verify VAE with AWS SDK
        id: upload
        run: |
          timeout --signal=TERM --kill-after=30s 10m npm run model-cache:upload-local:flux4090 -- vae "${{ steps.download.outputs.model_path }}"
          echo "vae_verified=true" >> "$GITHUB_OUTPUT"

      - name: Remove VAE and Hugging Face cache
        if: always()
        run: |
          rm -f -- "${{ steps.download.outputs.model_path }}"
          rm -rf -- "$HF_HOME"

  publish-and-verify:
    name: Publish and verify FLUX cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - verify-existing-flux
      - cache-qwen
      - cache-vae
    if: >-
      ${{ needs.verify-existing-flux.outputs.flux_verified == 'true' &&
          needs.cache-qwen.outputs.qwen_verified == 'true' &&
          needs.cache-vae.outputs.vae_verified == 'true' }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_READONLY_ACCESS_KEY_ID: ${{ secrets.R2_READONLY_ACCESS_KEY_ID }}
      R2_READONLY_SECRET_ACCESS_KEY: ${{ secrets.R2_READONLY_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Publish manifest and current pointer last
        run: npm run model-cache:publish:flux4090

      - name: Verify GPU read-only restore boundary
        run: npm run model-cache:verify:flux4090

      - name: Show published cache status
        run: npm run model-cache:status:flux4090

      - name: Validate first-image R2 restore plan
        run: npm run first-image:preflight
