name: LTX Runtime Static Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ltx-runtime/**"
      - "scripts/ltx-production-*.ts"
      - "scripts/ltx-runtime-tests.ts"
      - "src/lib/ltx-runtime/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run ltx:runtime:test
      - run: npm run ltx:production:test
      - run: npm run secret:scan
