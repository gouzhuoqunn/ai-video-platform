name: Stage 3Y production model cache

on:
  workflow_dispatch:
  push:
    branches:
      - codex/phase-3h-flux-parallel
    paths:
      - .github/stage3y-cache-trigger.json

permissions:
  contents: read

concurrency:
  group: production-model-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deduplicate:
    name: Inventory and deduplicate existing R2 objects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MODEL_CACHE_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Reuse or server-side copy exact SHA and size matches
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/model-cache/production-model-cache.ts deduplicate --copy | tee "$RUNNER_TEMP/deduplication-report.json"
          {
            echo '```json'
            cat "$RUNNER_TEMP/deduplication-report.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  cache:
    name: Cache and publish ${{ matrix.family }}
    needs: deduplicate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        family:
          - ultrareal-flux1-dev-fp8
          - wan22-remix-14b-i2v-fp8
    env:
      CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MODEL_CACHE_REGION: auto
      HF_XET_HIGH_PERFORMANCE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact credential gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CIVITAI_API_TOKEN:-}"
          test -n "${HF_TOKEN:-}"
          test -n "${R2_ACCESS_KEY_ID:-}"
          test -n "${R2_SECRET_ACCESS_KEY:-}"
          test -n "${R2_ACCOUNT_ID:-}"
          test -n "${R2_BUCKET_NAME:-}"
      - name: Install bounded tooling
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check "huggingface_hub[hf_xet]"
      - name: Plan downloads after verified R2 reuse
        run: npx tsx scripts/model-cache/production-model-cache.ts download-plan "${{ matrix.family }}" > "$RUNNER_TEMP/download-plan.json"
      - name: Download locked files in parallel and verify full SHA
        run: python scripts/model-cache/production-cache-download.py --family "${{ matrix.family }}" --output "$RUNNER_TEMP/model" --download-plan "$RUNNER_TEMP/download-plan.json"
      - name: Multipart upload, verify objects, publish manifest, publish current last
        run: npx tsx scripts/model-cache/production-model-cache.ts publish-local "${{ matrix.family }}" "$RUNNER_TEMP/model"

  final-readonly-verification:
    name: Verify both production families through readonly R2
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      R2_READONLY_ACCESS_KEY_ID: ${{ secrets.R2_READONLY_ACCESS_KEY_ID }}
      R2_READONLY_SECRET_ACCESS_KEY: ${{ secrets.R2_READONLY_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      MODEL_CACHE_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify image current, manifest, objects, ranges, and readonly boundary
        run: npx tsx scripts/model-cache/production-model-cache.ts verify-readonly ultrareal-flux1-dev-fp8
      - name: Verify video current, manifest, objects, ranges, and readonly boundary
        run: npx tsx scripts/model-cache/production-model-cache.ts verify-readonly wan22-remix-14b-i2v-fp8
