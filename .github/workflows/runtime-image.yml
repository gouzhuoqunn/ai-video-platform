name: Runtime Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Immutable runtime image tag"
        required: true
        default: "v0.1.0-pre-gpu"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - uses: docker/setup-buildx-action@v3

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/wan22-runtime"
          version_tag="${{ inputs.version_tag }}"
          sha_tag="sha-${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "version_tag=${version_tag}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${image}:${version_tag},${image}:${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gpu-worker
          file: ./gpu-worker/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify SSH bootstrap idle mode
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.image }}:${{ steps.image.outputs.version_tag }}"
          container="wan22-runtime-bootstrap-check-${GITHUB_RUN_ID}"
          docker run -d --name "${container}" \
            -e START_GPU_WORKER=false \
            "${image}" \
            "echo bootstrap-ok > /workspace/logs/bootstrap-check.txt"
          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sleep 30
          if ! docker ps --format '{{.Names}}' | grep -Fx "${container}" >/dev/null; then
            docker logs "${container}" || true
            echo "container exited before SSH/bootstrap could run"
            exit 1
          fi

          docker exec "${container}" test -f /workspace/logs/bootstrap-check.txt
          docker exec "${container}" sh -lc '! printenv SUPABASE_URL >/dev/null'
          docker exec "${container}" sh -lc '! printenv GPU_WORKER_PASSWORD >/dev/null'
          docker exec "${container}" sh -lc 'for f in /proc/[0-9]*/cmdline; do tr "\0" " " < "$f" | grep -q "worker.py" && exit 1; done; exit 0'
          docker logs "${container}" | grep -F "worker autostart is disabled"

      - name: Summarize image
        shell: bash
        run: |
          {
            echo "### Runtime image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Version tag: \`${{ steps.image.outputs.version_tag }}\`"
            echo "- Commit tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Model weights in image: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
