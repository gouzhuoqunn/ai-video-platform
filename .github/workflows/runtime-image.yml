name: Runtime Image

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Immutable runtime image tag"
        required: true
        default: "v0.1.0-pre-gpu"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/wan22-runtime"
          version_tag="${{ inputs.version_tag }}"
          sha_tag="sha-${GITHUB_SHA}"
          {
            echo "image=${image}"
            echo "version_tag=${version_tag}"
            echo "sha_tag=${sha_tag}"
            echo "tags=${image}:${version_tag},${image}:${sha_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gpu-worker
          file: ./gpu-worker/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          push: true
          provenance: true
          sbom: true

      - name: Summarize image
        shell: bash
        run: |
          {
            echo "### Runtime image"
            echo ""
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Version tag: \`${{ steps.image.outputs.version_tag }}\`"
            echo "- Commit tag: \`${{ steps.image.outputs.sha_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Model weights in image: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
